<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Takım Takip">
<meta name="theme-color" content="#ffffff">
<title>Takım ve Oyuncu Değerlendirme</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #1a1a1a; padding: 16px 12px 40px; min-height: 100vh; }
  #osp-app { max-width: 420px; margin: 0 auto; }
  #osp-app h1, #osp-app h2, #osp-app h3, #osp-app .osp-num { font-family: 'Rajdhani', sans-serif; }
  #osp-app input, #osp-app select { font-family: 'Inter', system-ui, sans-serif; }
  #osp-app ::placeholder { color: #b3b3b3; }

  .osp-shell { background: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #eee0c8; }
  .osp-header { background: #ffffff; padding: 16px 18px 14px; border-bottom: 3px solid #d32f2f; position: relative; }
  .osp-header-row { display: flex; align-items: center; gap: 10px; }
  .osp-back { background: #fff8e1; border: 1px solid #ffcc00; color: #d32f2f; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .osp-title { font-size: 20px; font-weight: 700; letter-spacing: 0.3px; color: #d32f2f; margin: 0; text-transform: uppercase; }
  .osp-subtitle { font-size: 12px; color: #a37a00; margin: 2px 0 0; font-weight: 600; }

  .osp-body { padding: 14px; background: #ffffff; min-height: 200px; }

  .osp-btn-primary { background: #d32f2f; color: #ffffff; border: none; font-weight: 600; font-size: 14px; padding: 12px 16px; border-radius: 10px; cursor: pointer; width: 100%; font-family: 'Inter', sans-serif; }
  .osp-btn-primary:active { transform: scale(0.98); }
  .osp-btn-secondary { background: #ffcc00; color: #7a3b00; border: none; font-weight: 600; font-size: 14px; padding: 12px 16px; border-radius: 10px; cursor: pointer; width: 100%; font-family: 'Inter', sans-serif; }
  .osp-btn-ghost { background: #ffffff; border: 1px solid #d32f2f; color: #d32f2f; font-weight: 600; font-size: 13px; padding: 9px 14px; border-radius: 9px; cursor: pointer; font-family: 'Inter', sans-serif; }

  .osp-team-card, .osp-player-card { background: #fffdf5; border: 1px solid #f2e2ab; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .osp-team-card:active, .osp-player-card:active { background: #fff5d6; }
  .osp-badge-wrap { position: relative; flex-shrink: 0; }
  .osp-jersey { width: 40px; height: 40px; border-radius: 8px; background: #d32f2f; border: 2px solid #ffcc00; display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 16px; color: #ffffff; flex-shrink: 0; overflow: hidden; }
  .osp-jersey img, .osp-team-badge img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  .osp-team-badge { width: 42px; height: 42px; border-radius: 10px; background: #ffcc00; border: 2px solid #d32f2f; display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 18px; color: #d32f2f; flex-shrink: 0; overflow: hidden; }
  .osp-badge-edit { position: absolute; bottom: -4px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: #d32f2f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; border: 2px solid #ffffff; cursor: pointer; }
  .osp-header-logo { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; border: 2px solid #ffcc00; flex-shrink: 0; }
  .osp-photo-lg-wrap { position: relative; width: 76px; height: 76px; margin: 0 auto 12px; }
  .osp-photo-lg { width: 76px; height: 76px; border-radius: 50%; background: #ffcc00; border: 2px solid #d32f2f; display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 26px; color: #d32f2f; overflow: hidden; }
  .osp-photo-lg img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .osp-photo-lg-edit { position: absolute; bottom: 0; right: 0; width: 26px; height: 26px; border-radius: 50%; background: #d32f2f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; border: 2px solid #ffffff; cursor: pointer; }
  .osp-player-name, .osp-team-name { font-size: 15px; font-weight: 600; color: #1a1a1a; margin: 0; }
  .osp-player-meta, .osp-team-meta { font-size: 12px; color: #a37a00; margin: 2px 0 0; font-weight: 500; }
  .osp-score-pill { margin-left: auto; text-align: center; flex-shrink: 0; }
  .osp-score-num { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 20px; line-height: 1; }
  .osp-score-label { font-size: 9px; color: #a37a00; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .osp-chevron { color: #d32f2f; font-size: 18px; flex-shrink: 0; }

  .osp-empty { text-align: center; padding: 40px 20px; color: #a37a00; }
  .osp-empty i { font-size: 30px; color: #ffcc00; }
  .osp-empty p { font-size: 13px; margin: 10px 0 0; font-weight: 500; }

  .osp-section { margin-bottom: 14px; }
  .osp-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #d32f2f; font-weight: 700; margin: 0 0 8px 4px; }
  .osp-card { background: #fffdf5; border: 1px solid #f2e2ab; border-radius: 12px; padding: 12px 14px; }

  .osp-field { margin-bottom: 10px; }
  .osp-field:last-child { margin-bottom: 0; }
  .osp-field label { display: block; font-size: 12px; color: #7a3b00; margin-bottom: 4px; font-weight: 600; }
  .osp-field input, .osp-field select { width: 100%; background: #ffffff; border: 1px solid #e8d48a; color: #1a1a1a; border-radius: 8px; padding: 9px 10px; font-size: 14px; }
  .osp-field input:focus, .osp-field select:focus { outline: none; border-color: #d32f2f; }
  .osp-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .osp-test-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f6ecc7; }
  .osp-test-row:last-child { border-bottom: none; }
  .osp-test-info { flex: 1; min-width: 0; }
  .osp-test-name { font-size: 12.5px; color: #1a1a1a; font-weight: 500; margin: 0; }
  .osp-test-val { font-size: 11px; color: #a37a00; margin: 1px 0 0; }
  .osp-bar-wrap { width: 74px; flex-shrink: 0; }
  .osp-bar-track { height: 6px; background: #f6ecc7; border-radius: 3px; overflow: hidden; }
  .osp-bar-fill { height: 100%; border-radius: 3px; }
  .osp-bar-score { text-align: right; font-size: 12px; font-weight: 700; margin-top: 3px; font-family: 'Rajdhani', sans-serif; }

  .osp-overall { text-align: center; padding: 18px 10px; }
  .osp-overall-num { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 52px; line-height: 1; }
  .osp-overall-scale { font-size: 13px; color: #a37a00; margin-top: 2px; font-weight: 600; }
  .osp-overall-verdict { font-size: 13px; color: #d32f2f; margin-top: 8px; font-weight: 600; }

  .osp-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .osp-tab { flex: 1; text-align: center; padding: 9px 4px; border-radius: 9px; background: #fffdf5; border: 1px solid #f2e2ab; font-size: 12px; color: #a37a00; font-weight: 600; cursor: pointer; }
  .osp-tab.active { background: #d32f2f; color: #ffffff; border-color: #d32f2f; }

  .osp-fab-row { margin-top: 4px; }
  .osp-delete-btn { background: #ffffff; border: 1px solid #d32f2f; color: #d32f2f; font-size: 12px; padding: 10px; border-radius: 9px; width: 100%; cursor: pointer; margin-top: 16px; font-family: 'Inter', sans-serif; font-weight: 600; }

  .osp-tools-row { display: flex; gap: 8px; margin-top: 10px; }
  .osp-tools-row .osp-btn-ghost { flex: 1; text-align: center; }

  .osp-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

  .osp-guide-p { font-size: 13px; line-height: 1.6; color: #333; margin: 0 0 10px; }
  .osp-guide-list { margin: 0 0 10px; padding-left: 18px; font-size: 13px; line-height: 1.6; color: #333; }
  .osp-guide-list li { margin-bottom: 4px; }
  .osp-acc-item { border-bottom: 1px solid #f6ecc7; }
  .osp-acc-item:last-child { border-bottom: none; }
  .osp-acc-head { display: flex; align-items: center; gap: 8px; padding: 11px 0; cursor: pointer; }
  .osp-acc-head-name { flex: 1; font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .osp-acc-head-cat { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #d32f2f; background: #fdeaea; padding: 2px 7px; border-radius: 6px; }
  .osp-acc-chevron { color: #a37a00; transition: transform 0.15s; font-size: 16px; }
  .osp-acc-item.open .osp-acc-chevron { transform: rotate(90deg); }
  .osp-acc-body { display: none; padding: 0 0 14px; }
  .osp-acc-item.open .osp-acc-body { display: block; }
  .osp-acc-row { font-size: 12.5px; line-height: 1.6; color: #333; margin-bottom: 8px; }
  .osp-acc-row b { color: #7a3b00; font-weight: 600; }
  .osp-acc-video { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #d32f2f; font-weight: 600; text-decoration: none; margin-top: 2px; }
  .osp-norm-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-bottom: 4px; }
  .osp-norm-table th { background: #fdeaea; color: #b71c1c; font-weight: 700; padding: 6px 5px; text-align: left; border: 1px solid #f2e2ab; }
  .osp-norm-table td { padding: 6px 5px; border: 1px solid #f2e2ab; color: #333; }
  .osp-norm-note { font-size: 10.5px; color: #a37a00; line-height: 1.5; margin: 6px 0 0; }
</style>
</head>
<body>

<div id="osp-app">
  <h2 class="osp-sr-only">Takım ve oyuncu değerlendirme uygulaması: takım listesi, her takım için kadro, oyuncu bilgisi ve fiziksel, psikolojik, teknik test verisi girişi ile otomatik 1-20 puanlama.</h2>
  <div class="osp-shell">
    <div class="osp-header">
      <div class="osp-header-row">
        <button class="osp-back" id="osp-back-btn" style="display:none;" aria-label="Geri"><i class="ti ti-arrow-left"></i></button>
        <img id="osp-header-logo" class="osp-header-logo" style="display:none;" alt="">
        <div style="flex:1; min-width:0;">
          <p class="osp-title" id="osp-title">Takımlar</p>
          <p class="osp-subtitle" id="osp-subtitle">Sezon başı test takibi</p>
        </div>
        <button class="osp-back" id="osp-guide-btn" aria-label="Rehber"><i class="ti ti-book-2"></i></button>
      </div>
    </div>
    <div class="osp-body" id="osp-body"></div>
  </div>
</div>

<script>
(function(){

var TESTS = [
  { key:'sprint20', label:'20m Sprint', unit:'sn', cat:'fiz', dir:'low', weak:4.8, good:3.7, source:'input' },
  { key:'illinois', label:'Illinois Çeviklik', unit:'sn', cat:'fiz', dir:'low', weak:21.0, good:17.0, source:'input' },
  { key:'tTest', label:'T-Test', unit:'sn', cat:'fiz', dir:'low', weak:14.5, good:10.5, source:'input' },
  { key:'uzunAtlama', label:'Durarak Uzun Atlama', unit:'cm', cat:'fiz', dir:'high', weak:95, good:175, source:'input' },
  { key:'kosu6dk', label:'6 Dk Koşu Mesafesi', unit:'m', cat:'fiz', dir:'high', weak:750, good:1200, source:'input' },
  { key:'gridKons', label:'Grid Konsantrasyon', unit:'doğru', cat:'psi', dir:'high', weak:8, good:35, source:'input' },
  { key:'stroop', label:'Stroop', unit:'doğru/45sn', cat:'psi', dir:'high', weak:12, good:38, source:'input' },
  { key:'baskiFark', label:'Baskı Performans Farkı', unit:'adet', cat:'psi', dir:'low', weak:4, good:0, source:'baskiFark' },
  { key:'pasYuzde', label:'Pas İsabet Yüzdesi', unit:'%', cat:'tek', dir:'high', weak:25, good:90, source:'pasYuzde' },
  { key:'slalom', label:'Slalom Dripling', unit:'sn', cat:'tek', dir:'low', weak:14, good:10, source:'input' },
  { key:'topSektirme', label:'Top Sektirme', unit:'adet', cat:'tek', dir:'high', weak:1, good:25, source:'input' },
  { key:'sutYuzde', label:'Şut İsabet Yüzdesi', unit:'%', cat:'tek', dir:'high', weak:15, good:80, source:'sutYuzde' },
  { key:'duvarPasi', label:'Duvar Pası', unit:'adet/30sn', cat:'tek', dir:'high', weak:4, good:18, source:'input' }
];

var CAT_LABELS = { fiz:'Fiziksel', psi:'Psikolojik', tek:'Teknik' };

var RAW_FIELDS = [
  { key:'sprint20', label:'20m Sprint', unit:'sn', step:'0.01', cat:'fiz' },
  { key:'illinois', label:'Illinois Çeviklik', unit:'sn', step:'0.1', cat:'fiz' },
  { key:'tTest', label:'T-Test', unit:'sn', step:'0.1', cat:'fiz' },
  { key:'uzunAtlama', label:'Durarak Uzun Atlama', unit:'cm', step:'1', cat:'fiz' },
  { key:'kosu6dk', label:'6 Dk Koşu Mesafesi', unit:'m', step:'1', cat:'fiz' },
  { key:'gridKons', label:'Grid Konsantrasyon', unit:'doğru sayı', step:'1', cat:'psi' },
  { key:'stroop', label:'Stroop', unit:'doğru/45sn', step:'1', cat:'psi' },
  { key:'penaltiBaskisiz', label:'Penaltı - Baskısız İsabet', unit:'/5', step:'1', cat:'psi' },
  { key:'penaltiBaskili', label:'Penaltı - Baskılı İsabet', unit:'/5', step:'1', cat:'psi' },
  { key:'pasToplam', label:'Pas - Toplam Deneme', unit:'adet', step:'1', cat:'tek' },
  { key:'pasIsabetli', label:'Pas - İsabetli', unit:'adet', step:'1', cat:'tek' },
  { key:'slalom', label:'Slalom Dripling', unit:'sn', step:'0.1', cat:'tek' },
  { key:'topSektirme', label:'Top Sektirme', unit:'adet', step:'1', cat:'tek' },
  { key:'sutToplam', label:'Şut - Toplam Deneme', unit:'adet', step:'1', cat:'tek' },
  { key:'sutIsabetli', label:'Şut - İsabetli', unit:'adet', step:'1', cat:'tek' },
  { key:'duvarPasi', label:'Duvar Pası', unit:'adet/30sn', step:'1', cat:'tek' }
];

var state = { view:'teams', teams:[], currentTeamId:null, currentPlayerId:null, tab:'bilgi', guideTab:'aciklama', prevView:'teams' };
var expandedProtocols = {};
var STORAGE_KEY = 'osp-takimlar-v1';
var LEGACY_KEY = 'osp-oyuncu-listesi-v1';

function num(v){ if(v===undefined||v===null||v===''){return null;} var n=parseFloat(v); return isNaN(n)?null:n; }
function round1(n){ return Math.round(n*10)/10; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

function computeDerived(p){
  var out = {};
  if(p.boy && p.kilo){ var m = p.boy/100; out.vki = round1(p.kilo/(m*m)); } else { out.vki = null; }
  if(p.sprint20){ out.hiz = round1(20/p.sprint20); } else { out.hiz = null; }
  var bBaskisiz = num(p.penaltiBaskisiz), bBaskili = num(p.penaltiBaskili);
  out.baskiFark = (bBaskisiz!==null && bBaskili!==null) ? (bBaskisiz-bBaskili) : null;
  var pasT = num(p.pasToplam), pasI = num(p.pasIsabetli);
  out.pasYuzde = (pasT && pasI!==null) ? round1(pasI/pasT*100) : null;
  var sutT = num(p.sutToplam), sutI = num(p.sutIsabetli);
  out.sutYuzde = (sutT && sutI!==null) ? round1(sutI/sutT*100) : null;
  return out;
}

function scoreFor(test, value){
  if(value===null||value===undefined||isNaN(value)) return null;
  var s;
  if(test.dir==='high'){ s = 1 + (value-test.weak)/(test.good-test.weak)*19; }
  else { s = 1 + (test.weak-value)/(test.weak-test.good)*19; }
  return clamp(s,1,20);
}

function overallScore(p){
  var d = computeDerived(p);
  var merged = Object.assign({}, p, d);
  var scores = [];
  TESTS.forEach(function(t){
    var raw = t.source==='input' ? num(p[t.key]) : merged[t.source];
    var s = scoreFor(t, raw);
    if(s!==null) scores.push(s);
  });
  if(scores.length===0) return null;
  var avg = scores.reduce(function(a,b){return a+b;},0)/scores.length;
  return round1(avg);
}

function verdictText(score){
  if(score===null) return 'Henüz test verisi girilmedi.';
  if(score>=16) return 'Çok iyi seviye - yaş grubunun belirgin şekilde üzerinde.';
  if(score>=13) return 'İyi seviye - çoğu test alanında yaş grubu ortalamasının üzerinde.';
  if(score>=10) return 'Orta seviye - yaş grubu ortalamasına yakın performans.';
  return 'Gelişime açık - bu alanlarda hedefli çalışma önerilir.';
}

function scoreColor(score){
  if(score===null) return '#c9c9c9';
  if(score>=16) return '#2e7d32';
  if(score>=13) return '#d32f2f';
  if(score>=10) return '#f0b429';
  return '#b71c1c';
}

function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.teams)); }
  catch(e) { alert('Veri kaydedilemedi: tarayıcı depolama alanı dolu ya da erişilemiyor olabilir.'); }
}

function load(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state.teams = JSON.parse(raw); return; }
    var legacy = localStorage.getItem(LEGACY_KEY);
    if(legacy){
      var players = JSON.parse(legacy);
      if(Array.isArray(players) && players.length){
        state.teams = [{ id:'t'+Date.now(), name:'Takımım', players: players }];
        save();
        return;
      }
    }
    state.teams = [];
  } catch(e) { state.teams = []; }
}

function resizeImage(file, maxDim, callback){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ alert('Görsel okunamadı.'); };
    img.src = ev.target.result;
  };
  reader.onerror = function(){ alert('Dosya okunamadı.'); };
  reader.readAsDataURL(file);
}

function pickImage(maxDim, onPicked){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]){
      resizeImage(e.target.files[0], maxDim, onPicked);
    }
    document.body.removeChild(input);
  });
  input.click();
}

function getTeam(){ return state.teams.find(function(t){ return t.id===state.currentTeamId; }); }
function getPlayer(){ var t = getTeam(); if(!t) return null; return t.players.find(function(p){ return p.id===state.currentPlayerId; }); }

function addTeam(){
  var name = prompt('Takım adı:');
  if(!name || !name.trim()) return;
  var t = { id:'t'+Date.now(), name: name.trim(), players: [] };
  state.teams.push(t);
  save();
  render();
}

function deleteTeam(id){
  state.teams = state.teams.filter(function(t){ return t.id!==id; });
  state.view = 'teams';
  save();
  render();
}

function addPlayer(){
  var t = getTeam(); if(!t) return;
  var maxNo = t.players.reduce(function(m,p){ return Math.max(m, p.no||0); }, 0);
  var p = { id: 'p'+Date.now(), no: maxNo+1, adSoyad:'', dogumTarihi:'', yas:null, boy:null, kilo:null };
  t.players.push(p);
  state.currentPlayerId = p.id;
  state.view = 'detail';
  state.tab = 'bilgi';
  save();
  render();
}

function deletePlayer(id){
  var t = getTeam(); if(!t) return;
  t.players = t.players.filter(function(p){ return p.id!==id; });
  state.view = 'squad';
  save();
  render();
}

function updateField(key, val){
  var p = getPlayer(); if(!p) return;
  p[key] = val;
  save();
}

function exportData(){
  var blob = new Blob([JSON.stringify(state.teams, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'takim-verileri.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('invalid');
      state.teams = data;
      save();
      state.view = 'teams';
      render();
    } catch(err) {
      alert('Dosya okunamadı. Geçerli bir yedek dosyası seç.');
    }
  };
  reader.readAsText(file);
}

function fieldRow(label, key, value, opts){
  opts = opts || {};
  var wrap = el('<div class="osp-field"></div>');
  wrap.appendChild(el('<label>'+label+(opts.unit?' <span style="color:#c9a94a;">('+opts.unit+')</span>':'')+'</label>'));
  var input;
  if(opts.type==='date'){ input = el('<input type="date" />'); }
  else if(opts.type==='text'){ input = el('<input type="text" placeholder="'+(opts.placeholder||'')+'" />'); }
  else { input = el('<input type="number" inputmode="decimal" step="'+(opts.step||'1')+'" placeholder="-" />'); }
  if(value!==null && value!==undefined) input.value = value;
  input.addEventListener('input', function(){
    var v = opts.type==='text' || opts.type==='date' ? input.value : num(input.value);
    updateField(key, v);
  });
  wrap.appendChild(input);
  return wrap;
}

function renderDetailTabVeri(container, p){
  ['fiz','psi','tek'].forEach(function(cat){
    var sec = el('<div class="osp-section"></div>');
    sec.appendChild(el('<p class="osp-section-title">'+CAT_LABELS[cat]+'</p>'));

      card.appendChild(fieldRow(f.label, f.key, p[f.key], {unit:f.unit, step:f.step}));

function renderDetailTabSonuc(container, p){
  var d = computeDerived(p);
  var merged = Object.assign({}, p, d);
  var score = overallScore(p);

  var overallCard = el('<div class="osp-card osp-overall"></div>');
  overallCard.innerHTML =
    '<div class="osp-overall-num" style="color:'+scoreColor(score)+'">'+(score!==null?score:'-')+'</div>' +
    '<div class="osp-overall-scale">/ 20 GENEL NOT</div>' +
    '<div class="osp-overall-verdict">'+verdictText(score)+'</div>';
  container.appendChild(overallCard);

  ['fiz','psi','tek'].forEach(function(cat){
    var sec = el('<div class="osp-section" style="margin-top:14px;"></div>');
    sec.appendChild(el('<p class="osp-section-title">'+CAT_LABELS[cat]+'</p>'));
    var card = el('<div class="osp-card"></div>');
    TESTS.filter(function(t){ return t.cat===cat; }).forEach(function(t){
      var raw = t.source==='input' ? num(p[t.key]) : merged[t.source];
      var s = scoreFor(t, raw);
      var pct = s!==null ? ((s-1)/19*100) : 0;
      var row = el(
        '<div class="osp-test-row">' +
          '<div class="osp-test-info">' +
            '<p class="osp-test-name">'+t.label+'</p>' +
            '<p class="osp-test-val">'+(raw!==null?raw+' '+t.unit:'Veri yok')+'</p>' +
          '</div>' +
          '<div class="osp-bar-wrap">' +
            '<div class="osp-bar-track"><div class="osp-bar-fill" style="width:'+pct+'%; background:'+scoreColor(s)+';"></div></div>' +
            '<div class="osp-bar-score" style="color:'+scoreColor(s)+'">'+(s!==null?round1(s):'-')+'</div>' +
          '</div>' +
        '</div>'
      );
      card.appendChild(row);
    });
    sec.appendChild(card);
    container.appendChild(sec);
  });

  if(merged.hiz!==null){
    var hizCard = el(
      '<div class="osp-card" style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">' +
        '<span style="font-size:12.5px; color:#7a3b00; font-weight:600;">Hız (20m sprintten)</span>' +
        '<span class="osp-num" style="font-weight:700; font-size:16px; color:#d32f2f;">'+merged.hiz+' m/sn</span>' +
      '</div>'
    );
    container.appendChild(hizCard);
  }
}

      '<div class="osp-tab" data-tab="sonuc">Sonuçlar</div>' +
    '</div>'
  );
  Array.prototype.forEach.call(tabs.querySelectorAll('.osp-tab'), function(t){

];
var PROTOCOL_CATS = [
  { key:'antro', label:'Antropometri' },
  { key:'fiz', label:'Fiziksel' },
  { key:'psi', label:'Psikolojik' },
  { key:'tek', label:'Teknik' }
];

function renderGuideAciklama(container){
  var card = el('<div class="osp-card"></div>');
  card.innerHTML =
    '<p class="osp-guide-p"><b>Bu uygulama nasıl kullanılır?</b></p>' +
    '<p class="osp-guide-p">1. <b>Test Protokolleri</b> sekmesinde her testin nasıl uygulanacağı, gerekli malzemeler ve gösterim videosu yer alır.</p>' +
    '<p class="osp-guide-p">2. Oyuncu detayındaki <b>Test Verisi</b> sekmesinden ölçüm sonuçlarını girin, diğer tüm sonuçlar (VKİ, hız, isabet yüzdeleri vb.) otomatik hesaplanır.</p>' +
    '<p class="osp-guide-p">3. <b>Norm Değerleri</b> sekmesinde 9-10 yaş grubu için genel referans (yaklaşık) değerlendirme aralıkları bulunur. Bu değerler yayınlanmış genç futbolcu/çocuk fiziksel uygunluk literatüründen derlenmiş genel referanslardır; kesin klinik ölçüm değildir.</p>' +
    '<p class="osp-guide-p">4. Testleri sezon başında uygulayıp sezon ortası ve sonunda tekrarlayarak oyuncuların gelişimini karşılaştırmalı biçimde izleyebilirsiniz.</p>' +
    '<p class="osp-guide-p" style="margin-top:14px;"><b>Genel uygulama önerileri</b></p>' +
    '<ul class="osp-guide-list">' +
      '<li>Testlerden önce mutlaka 10-15 dakikalık genel ısınma (hafif koşu + dinamik esneme) yaptırın.</li>' +
      '<li>Testleri aynı gün art arda yapıyorsanız, en yorucu olanı (dayanıklılık testi) en sona bırakın.</li>' +
      '<li>Her test öncesi çocuklara test tekniğini gösterin ve 1 deneme hakkı tanıyın.</li>' +
      '<li>Sıcak/soğuk havada, zeminin uygunluğuna ve çocukların su ihtiyacına dikkat edin.</li>' +
      '<li>9-10 yaş grubunda sonuçlar biyolojik olgunlaşma farklarından etkilenebilir; tek başına yetenek göstergesi olarak yorumlamayın.</li>' +
    '</ul>';
  container.appendChild(card);
}

function renderGuideProtokoller(container){
  PROTOCOL_CATS.forEach(function(pc){
    var items = PROTOCOLS.filter(function(pr){ return pr.cat===pc.key; });
    if(!items.length) return;
    var sec = el('<div class="osp-section"></div>');
    sec.appendChild(el('<p class="osp-section-title">'+pc.label+'</p>'));
    var card = el('<div class="osp-card"></div>');
    items.forEach(function(pr){
      var item = el('<div class="osp-acc-item"></div>');
      var videoHtml = pr.video ? '<a class="osp-acc-video" href="'+pr.video+'" target="_blank" rel="noopener"><i class="ti ti-player-play" aria-hidden="true"></i>Video gösterimi</a>' : '';
      item.innerHTML =
        '<div class="osp-acc-head">' +
          '<span class="osp-acc-head-cat">'+pc.label+'</span>' +
          '<span class="osp-acc-head-name">'+pr.name+'</span>' +
          '<i class="ti ti-chevron-right osp-acc-chevron" aria-hidden="true"></i>' +
        '</div>' +
        '<div class="osp-acc-body">' +
          '<p class="osp-acc-row"><b>Ölçülen özellik:</b> '+pr.ozellik+'</p>' +
          '<p class="osp-acc-row"><b>Ekipman:</b> '+pr.ekipman+'</p>' +
          '<p class="osp-acc-row"><b>Uygulama:</b> '+pr.talimat+'</p>' +
          '<p class="osp-acc-row"><b>Ölçüm birimi:</b> '+pr.birim+'</p>' +
          '<p class="osp-acc-row"><b>Hesaplama:</b> '+pr.formul+'</p>' +
          videoHtml +
        '</div>';
      if(expandedProtocols[pr.key]) item.classList.add('open');
      item.querySelector('.osp-acc-head').addEventListener('click', function(){
        expandedProtocols[pr.key] = !expandedProtocols[pr.key];
        render();
      });
      card.appendChild(item);
    });
    sec.appendChild(card);
    container.appendChild(sec);
  });
}

    ['Baskı Performans Farkı','>3','2-3','1-2','0-1','<0'],
    ['Pas İsabet (%)','<41','41-58','58-74','74-90','>=90'],
    ['Slalom Dripling (sn)','>13.0','12.0-13.0','11.0-12.0','10.0-11.0','<10.0'],
    ['Top Sektirme','<7','7-13','13-19','19-25','>=25'],
    ['Şut İsabet (%)','<31','31-48','48-64','64-80','>=80'],
    ['Duvar Pası','<8','8-11','11-14','14-18','>=18']
  ];
  var tableHtml = '<table class="osp-norm-table"><tr><th>Test</th><th>Zayıf</th><th>Ort. altı</th><th>Ortalama</th><th>Ort. üstü</th><th>İyi/Çok iyi</th></tr>';
  rows.forEach(function(r){

  card3.innerHTML = tableHtml + '<p class="osp-norm-note">Bu testler için büyük ölçekli uluslararası norm verisi bulunmadığından aralıklar yayınlanmış literatürden derlenmiş pratik başlangıç referanslarıdır; kulübünüzün kendi verisini biriktirdikçe kendi normlarınızı geliştirmeniz önerilir.</p>';

function renderGuide(){
  document.getElementById('osp-back-btn').style.display = 'flex';
  document.getElementById('osp-header-logo').style.display = 'none';
  document.getElementById('osp-title').textContent = 'Rehber';
  document.getElementById('osp-subtitle').textContent = 'Açıklama · protokoller · normlar';
  var body = document.getElementById('osp-body');
  body.innerHTML = '';

  var tabs = el(
    '<div class="osp-tabs">' +
      '<div class="osp-tab" data-tab="aciklama">Açıklama</div>' +
      '<div class="osp-tab" data-tab="protokol">Test Protokolleri</div>' +
      '<div class="osp-tab" data-tab="norm">Norm Değerleri</div>' +
    '</div>'
  );
  Array.prototype.forEach.call(tabs.querySelectorAll('.osp-tab'), function(t){
    if(t.getAttribute('data-tab')===state.guideTab) t.classList.add('active');
    t.addEventListener('click', function(){ state.guideTab = t.getAttribute('data-tab'); render(); });
  });
  body.appendChild(tabs);

  var content = el('<div></div>');
  if(state.guideTab==='aciklama') renderGuideAciklama(content);
  else if(state.guideTab==='protokol') renderGuideProtokoller(content);
  else renderGuideNormlar(content);
  body.appendChild(content);
}

function render(){
  document.getElementById('osp-guide-btn').style.display = (state.view==='teams') ? 'flex' : 'none';
  if(state.view==='teams') renderTeams();
  else if(state.view==='squad') renderSquad();
  else if(state.view==='guide') renderGuide();
  else renderDetail();
}

document.getElementById('osp-guide-btn').addEventListener('click', function(){
  state.prevView = state.view;
  state.view = 'guide';
  render();
});


document.getElementById('osp-back-btn').addEventListener('click', function(){
  if(state.view==='detail'){ state.view = 'squad'; }
  else if(state.view==='guide'){ state.view = state.prevView || 'teams'; }
  else { state.view = 'teams'; }
  render();
});

load();
render();
})();
</script>
