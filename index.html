<title>Performans Pusulası</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #1a1a1a; padding: 16px 12px 40px; min-height: 100vh; }
  #osp-app { max-width: 420px; margin: 0 auto; }
  #osp-app h1, #osp-app h2, #osp-app h3, #osp-app .osp-num { font-family: 'Rajdhani', sans-serif; }
  #osp-app input, #osp-app select { font-family: 'Inter', system-ui, sans-serif; }
  #osp-app ::placeholder { color: #b3b3b3; }

  .osp-shell { background: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #eee0c8; }
  .osp-header { background: #ffffff; padding: 16px 18px 14px; border-bottom: 3px solid #d32f2f; position: relative; }
  .osp-header-row { display: flex; align-items: center; gap: 10px; }
  .osp-back { background: #fff8e1; border: 1px solid #ffcc00; color: #d32f2f; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .osp-title { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; color: #d32f2f; margin: 0; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .osp-subtitle { font-size: 12px; color: #a37a00; margin: 2px 0 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .osp-body { padding: 14px; background: #ffffff; min-height: 200px; }

  .osp-btn-primary { background: #d32f2f; color: #ffffff; border: none; font-weight: 600; font-size: 14px; padding: 12px 16px; border-radius: 10px; cursor: pointer; width: 100%; font-family: 'Inter', sans-serif; }
  .osp-btn-primary:active { transform: scale(0.98); }
  .osp-btn-secondary { background: #ffcc00; color: #7a3b00; border: none; font-weight: 600; font-size: 14px; padding: 12px 16px; border-radius: 10px; cursor: pointer; width: 100%; font-family: 'Inter', sans-serif; }
  .osp-btn-ghost { background: #ffffff; border: 1px solid #d32f2f; color: #d32f2f; font-weight: 600; font-size: 13px; padding: 9px 14px; border-radius: 9px; cursor: pointer; font-family: 'Inter', sans-serif; }

  .osp-team-card, .osp-player-card { background: #fffdf5; border: 1px solid #f2e2ab; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .osp-team-card:active, .osp-player-card:active { background: #fff5d6; }
  .osp-badge-wrap { position: relative; flex-shrink: 0; }
  .osp-jersey { width: 40px; height: 40px; border-radius: 8px; background: #d32f2f; border: 2px solid #ffcc00; display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 16px; color: #ffffff; flex-shrink: 0; overflow: hidden; }
  .osp-jersey img, .osp-team-badge img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  .osp-team-badge { width: 42px; height: 42px; border-radius: 10px; background: #ffcc00; border: 2px solid #d32f2f; display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 18px; color: #d32f2f; flex-shrink: 0; overflow: hidden; }
  .osp-badge-edit { position: absolute; bottom: -4px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: #d32f2f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; border: 2px solid #ffffff; cursor: pointer; }
  .osp-header-logo { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; border: 2px solid #ffcc00; flex-shrink: 0; }
  .osp-app-logo { width: 38px; height: 38px; border-radius: 9px; object-fit: contain; flex-shrink: 0; cursor: pointer; background: #ffffff; border: 1px solid #f2e2ab; }
  .osp-app-logo:active { transform: scale(0.94); }
  .osp-photo-lg-wrap { position: relative; width: 76px; height: 76px; margin: 0 auto 12px; }
  .osp-photo-lg { width: 76px; height: 76px; border-radius: 50%; background: #ffcc00; border: 2px solid #d32f2f; display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 26px; color: #d32f2f; overflow: hidden; }
  .osp-photo-lg img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .osp-photo-lg-edit { position: absolute; bottom: 0; right: 0; width: 26px; height: 26px; border-radius: 50%; background: #d32f2f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; border: 2px solid #ffffff; cursor: pointer; }
  .osp-player-name, .osp-team-name { font-size: 15px; font-weight: 600; color: #1a1a1a; margin: 0; }
  .osp-player-meta, .osp-team-meta { font-size: 12px; color: #a37a00; margin: 2px 0 0; font-weight: 500; }
  .osp-score-pill { margin-left: auto; text-align: center; flex-shrink: 0; }
  .osp-card-delete { background: none; border: none; color: #c9a94a; padding: 4px; margin-left: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .osp-card-delete:active { color: #d32f2f; }
  .osp-check-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f6ecc7; }
  .osp-check-row:last-child { border-bottom: none; }
  .osp-check-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: #d32f2f; flex-shrink: 0; }
  .osp-check-row label { font-size: 13px; color: #1a1a1a; font-weight: 500; }
  .osp-score-num { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 20px; line-height: 1; }
  .osp-score-label { font-size: 9px; color: #a37a00; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .osp-chevron { color: #d32f2f; font-size: 18px; flex-shrink: 0; }

  .osp-empty { text-align: center; padding: 40px 20px; color: #a37a00; }
  .osp-empty i { font-size: 30px; color: #ffcc00; }
  .osp-empty p { font-size: 13px; margin: 10px 0 0; font-weight: 500; }

  .osp-section { margin-bottom: 14px; }
  .osp-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #d32f2f; font-weight: 700; margin: 0 0 8px 4px; }
  .osp-card { background: #fffdf5; border: 1px solid #f2e2ab; border-radius: 12px; padding: 12px 14px; }

  .osp-field { margin-bottom: 10px; }
  .osp-field:last-child { margin-bottom: 0; }
  .osp-field label { display: block; font-size: 12px; color: #7a3b00; margin-bottom: 4px; font-weight: 600; }
  .osp-field input, .osp-field select, .osp-field textarea { width: 100%; background: #ffffff; border: 1px solid #e8d48a; color: #1a1a1a; border-radius: 8px; padding: 9px 10px; font-size: 14px; }
  .osp-field textarea { min-height: 120px; font-family: 'Consolas', monospace; font-size: 11.5px; resize: vertical; }
  .osp-field input:focus, .osp-field select:focus, .osp-field textarea:focus { outline: none; border-color: #d32f2f; }
  .osp-sync-status { display: flex; align-items: center; gap: 10px; padding: 4px 2px 14px; }
  .osp-sync-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .osp-sync-dot.on { background: #2e7d32; }
  .osp-sync-dot.off { background: #b71c1c; }
  .osp-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .osp-test-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f6ecc7; }
  .osp-test-row:last-child { border-bottom: none; }
  .osp-test-info { flex: 1; min-width: 0; }
  .osp-test-name { font-size: 12.5px; color: #1a1a1a; font-weight: 500; margin: 0; }
  .osp-test-val { font-size: 11px; color: #a37a00; margin: 1px 0 0; }
  .osp-bar-wrap { width: 74px; flex-shrink: 0; }
  .osp-bar-track { height: 6px; background: #f6ecc7; border-radius: 3px; overflow: hidden; }
  .osp-bar-fill { height: 100%; border-radius: 3px; }
  .osp-bar-score { text-align: right; font-size: 12px; font-weight: 700; margin-top: 3px; font-family: 'Rajdhani', sans-serif; }

  .osp-overall { text-align: center; padding: 18px 10px; }
  .osp-overall-num { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 52px; line-height: 1; }
  .osp-overall-scale { font-size: 13px; color: #a37a00; margin-top: 2px; font-weight: 600; }
  .osp-overall-verdict { font-size: 13px; color: #d32f2f; margin-top: 8px; font-weight: 600; }

  .osp-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .osp-tab { flex: 1; text-align: center; padding: 9px 4px; border-radius: 9px; background: #fffdf5; border: 1px solid #f2e2ab; font-size: 12px; color: #a37a00; font-weight: 600; cursor: pointer; }
  .osp-tab.active { background: #d32f2f; color: #ffffff; border-color: #d32f2f; }

  .osp-fab-row { margin-top: 4px; }
  .osp-delete-btn { background: #ffffff; border: 1px solid #d32f2f; color: #d32f2f; font-size: 12px; padding: 10px; border-radius: 9px; width: 100%; cursor: pointer; margin-top: 16px; font-family: 'Inter', sans-serif; font-weight: 600; }

  .osp-tools-row { display: flex; gap: 8px; margin-top: 10px; }
  .osp-tools-row .osp-btn-ghost { flex: 1; text-align: center; }

  .osp-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

  .osp-guide-p { font-size: 13px; line-height: 1.6; color: #333; margin: 0 0 10px; }
  .osp-guide-list { margin: 0 0 10px; padding-left: 18px; font-size: 13px; line-height: 1.6; color: #333; }
  .osp-guide-list li { margin-bottom: 4px; }
  .osp-acc-item { border-bottom: 1px solid #f6ecc7; }
  .osp-acc-item:last-child { border-bottom: none; }
  .osp-acc-head { display: flex; align-items: center; gap: 8px; padding: 11px 0; cursor: pointer; }
  .osp-acc-head-name { flex: 1; font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .osp-acc-head-cat { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #d32f2f; background: #fdeaea; padding: 2px 7px; border-radius: 6px; }
  .osp-acc-chevron { color: #a37a00; transition: transform 0.15s; font-size: 16px; }
  .osp-acc-item.open .osp-acc-chevron { transform: rotate(90deg); }
  .osp-acc-body { display: none; padding: 0 0 14px; }
  .osp-acc-item.open .osp-acc-body { display: block; }
  .osp-acc-row { font-size: 12.5px; line-height: 1.6; color: #333; margin-bottom: 8px; }
  .osp-acc-row b { color: #7a3b00; font-weight: 600; }
  .osp-acc-video { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #d32f2f; font-weight: 600; text-decoration: none; margin-top: 2px; background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; padding: 0; }
  .osp-acc-img { width: 100%; border-radius: 10px; margin-bottom: 10px; display: block; border: 1px solid #f2e2ab; }

  .osp-video-overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.86); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .osp-video-box { width: 100%; max-width: 420px; background: #000; border-radius: 14px; overflow: hidden; position: relative; }
  .osp-video-box iframe { width: 100%; aspect-ratio: 16 / 9; display: block; border: none; }
  .osp-video-close { position: absolute; top: -40px; right: 0; width: 34px; height: 34px; border-radius: 50%; background: #ffffff; border: none; color: #1a1a1a; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .osp-norm-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-bottom: 4px; }
  .osp-norm-table th { background: #fdeaea; color: #b71c1c; font-weight: 700; padding: 6px 5px; text-align: left; border: 1px solid #f2e2ab; }
  .osp-norm-table td { padding: 6px 5px; border: 1px solid #f2e2ab; color: #333; }
  .osp-norm-note { font-size: 10.5px; color: #a37a00; line-height: 1.5; margin: 6px 0 0; }
  .osp-norm-edit-label { font-size: 12px; font-weight: 600; color: #7a3b00; margin: 0 0 5px; }
  .osp-norm-edit-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .osp-norm-edit-grid input { width: 100%; font-size: 11px; padding: 6px 3px; border: 1px solid #e8d48a; border-radius: 6px; text-align: center; background: #ffffff; color: #1a1a1a; }
  .osp-norm-edit-grid input:focus { outline: none; border-color: #d32f2f; }

  .osp-karne-card { background: #ffffff; border-radius: 18px; overflow: hidden; border: 1px solid #ececec; }
  .osp-karne-hero { background: linear-gradient(135deg, #0f1c3d, #1b2e5c); padding: 20px 18px 18px; position: relative; }
  .osp-karne-hero-top { display: flex; align-items: center; gap: 12px; }
  .osp-karne-hero-logo { width: 42px; height: 42px; border-radius: 10px; background: #ffffff; padding: 4px; object-fit: contain; flex-shrink: 0; }
  .osp-karne-hero-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.15; color: #ffffff; text-transform: uppercase; letter-spacing: 0.3px; }
  .osp-karne-hero-title span { color: #ff5252; }
  .osp-karne-photobar { background: rgba(255,255,255,0.07); border-radius: 14px; margin-top: 16px; padding: 14px; display: flex; align-items: center; gap: 14px; position: relative; }
  .osp-karne-photo-lg { width: 72px; height: 72px; border-radius: 50%; border: 3px solid #ff5252; overflow: hidden; background: #ffcc00; display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 26px; color: #d32f2f; flex-shrink: 0; }
  .osp-karne-photo-lg img { width: 100%; height: 100%; object-fit: cover; }
  .osp-karne-hero-name { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 19px; color: #ffffff; margin: 0; }
  .osp-karne-hero-meta { font-size: 11.5px; color: #c3cde4; margin: 3px 0 0; font-weight: 600; }
  .osp-karne-team-badge { position: absolute; bottom: -14px; left: 16px; width: 34px; height: 34px; border-radius: 9px; background: #ffffff; border: 2px solid #ff5252; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .osp-karne-team-badge img { width: 100%; height: 100%; object-fit: cover; }
  .osp-karne-body { padding: 26px 18px 20px; }
  .osp-karne-overall2 { display: flex; align-items: center; justify-content: space-between; background: #fff8e1; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .osp-karne-overall2-label { font-size: 11px; font-weight: 700; color: #7a3b00; text-transform: uppercase; letter-spacing: 0.5px; }
  .osp-karne-overall2-num { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 36px; line-height: 1; }
  .osp-karne-sec-head { display: flex; align-items: center; gap: 7px; margin: 0 0 12px; color: #d32f2f; }
  .osp-karne-sec-head span { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14.5px; color: #1a1a1a; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; }
  .osp-karne-sec-head .line { flex: 1; height: 2px; background: linear-gradient(90deg, #d32f2f, rgba(211,47,47,0)); }
  .osp-karne-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-bottom: 22px; }
  .osp-karne-stat-label { font-size: 11px; color: #555; font-weight: 600; display: block; margin-bottom: 5px; }
  .osp-karne-stat-track { height: 6px; background: #ececec; border-radius: 3px; overflow: hidden; }
  .osp-karne-stat-fill { height: 100%; border-radius: 3px; }
  .osp-karne-stat-val { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .osp-karne-footer { text-align: center; margin-top: 4px; font-size: 10px; color: #bbb; }
</style>

function connectSync(config){
  try {
    if(!window.firebase){ alert('Bağlantı kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.'); return; }
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(config); }
    db = firebase.firestore();
    localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(config));
    attachSync();
  } catch(e){
    alert('Bağlantı kurulamadı: ' + e.message);
  }
}

function disconnectSync(){
  db = null;
  syncStatus = 'off';
  localStorage.removeItem(SYNC_CONFIG_KEY);
  render();
}

function attachSync(){
  syncStatus = 'connecting';
  db.collection('osp-sync').doc('main').onSnapshot(function(doc){
    syncStatus = 'on';
    if(doc.exists){
      var remoteTeams = doc.data().teams || [];
      var remoteNorms = doc.data().norms || null;
      var remoteStr = JSON.stringify({ teams: remoteTeams, norms: remoteNorms });
      var localStr = JSON.stringify({ teams: state.teams, norms: state.norms });
      if(remoteStr !== localStr){
        state.teams = remoteTeams;
        state.norms = remoteNorms;
        try { localStorage.setItem(STORAGE_KEY, remoteStr); } catch(e){}
        render();
      }
    } else if(state.teams.length){
      db.collection('osp-sync').doc('main').set({ teams: state.teams, norms: state.norms, updatedAt: Date.now() });
    }
    if(state.view==='sync') render();
  }, function(err){
    syncStatus = 'off';
    if(state.view==='sync') render();
  });
}

function computeDerived(p){
  var out = {};
  if(p.boy && p.kilo){ var m = p.boy/100; out.vki = round1(p.kilo/(m*m)); } else { out.vki = null; }
  if(p.sprint20){ out.hiz = round1(20/p.sprint20); } else { out.hiz = null; }
  var bBaskisiz = num(p.penaltiBaskisiz), bBaskili = num(p.penaltiBaskili);
  out.baskiFark = (bBaskisiz!==null && bBaskili!==null) ? (bBaskisiz-bBaskili) : null;
  var pasT = num(p.pasToplam), pasI = num(p.pasIsabetli);
  out.pasYuzde = (pasT && pasI!==null) ? round1(pasI/pasT*100) : null;
  var sutT = num(p.sutToplam), sutI = num(p.sutIsabetli);
  out.sutYuzde = (sutT && sutI!==null) ? round1(sutI/sutT*100) : null;
  return out;
}

function scoreFor(test, value){
  if(value===null||value===undefined||isNaN(value)) return null;
  var s;
  if(test.dir==='high'){ s = 1 + (value-test.weak)/(test.good-test.weak)*19; }
  else { s = 1 + (test.weak-value)/(test.weak-test.good)*19; }
  return clamp(s,1,20);
}

function overallScore(p, team){
  var d = computeDerived(p);
  var merged = Object.assign({}, p, d);
  var scores = [];
  activeTestsFor(team).forEach(function(t){
    var raw = t.source==='input' ? num(p[t.key]) : merged[t.source];
    var s = scoreFor(t, raw);
    if(s!==null) scores.push(s);
  });
  if(scores.length===0) return null;
  var avg = scores.reduce(function(a,b){return a+b;},0)/scores.length;
  return round1(avg);
}

function verdictText(score){
  if(score===null) return 'Henüz test verisi girilmedi.';
  if(score>=16) return 'Çok iyi seviye - yaş grubunun belirgin şekilde üzerinde.';
  if(score>=13) return 'İyi seviye - çoğu test alanında yaş grubu ortalamasının üzerinde.';
  if(score>=10) return 'Orta seviye - yaş grubu ortalamasına yakın performans.';
  return 'Gelişime açık - bu alanlarda hedefli çalışma önerilir.';
}

function scoreColor(score){
  if(score===null) return '#c9c9c9';
  if(score>=16) return '#2e7d32';
  if(score>=13) return '#d32f2f';
  if(score>=10) return '#f0b429';
  return '#b71c1c';
}

function resizeImage(file, maxDim, callback){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ alert('Görsel okunamadı.'); };
    img.src = ev.target.result;
  };
  reader.onerror = function(){ alert('Dosya okunamadı.'); };
  reader.readAsDataURL(file);
}

function pickImage(maxDim, onPicked){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]){
      resizeImage(e.target.files[0], maxDim, onPicked);
    }
    document.body.removeChild(input);
  });
  input.click();
}

function renderSquad(){
  var t = getTeam();
  if(!t){ state.view='teams'; render(); return; }

  document.getElementById('osp-back-btn').style.display = 'none';
  var headerLogo = document.getElementById('osp-header-logo');
  headerLogo.style.display = 'none';
  document.getElementById('osp-title').textContent = t.name;
  document.getElementById('osp-subtitle').textContent = t.players.length + ' oyuncu · ' + ageOf(t) + ' Yaş kadrosu';
  var body = document.getElementById('osp-body');
  body.innerHTML = '';

  if(t.players.length===0){
    body.appendChild(el('<div class="osp-empty"><i class="ti ti-users" aria-hidden="true"></i><p>Bu takımda henüz oyuncu yok.<br>İlk oyuncuyu ekleyerek başla.</p></div>'));
  } else {
    var sorted = t.players.slice().sort(function(a,b){ return (a.no||0)-(b.no||0); });
    sorted.forEach(function(p){
      var score = overallScore(p, t);
      var jerseyInner = p.photo ? '<img src="'+p.photo+'" alt="">' : (p.no!=null?p.no:'-');
      var card = el(
        '<div class="osp-player-card">' +
          '<div class="osp-badge-wrap">' +
            '<div class="osp-jersey">'+jerseyInner+'</div>' +
            '<div class="osp-badge-edit" title="Fotoğraf değiştir"><i class="ti ti-camera" aria-hidden="true"></i></div>' +
          '</div>' +
          '<div style="min-width:0; flex:1;">' +
            '<p class="osp-player-name">'+(p.adSoyad ? escapeHtml(p.adSoyad) : 'İsimsiz oyuncu')+'</p>' +
            '<p class="osp-player-meta">'+(p.yas ? p.yas+' yaş' : 'Yaş girilmedi')+'</p>' +
          '</div>' +
          '<div class="osp-score-pill">' +
            '<div class="osp-score-num" style="color:'+scoreColor(score)+'">'+(score!==null?score:'-')+'</div>' +
            '<div class="osp-score-label">Genel Not</div>' +
          '</div>' +
          '<button class="osp-card-delete" title="Oyuncuyu sil" aria-label="Oyuncuyu sil"><i class="ti ti-trash" aria-hidden="true"></i></button>' +
        '</div>'
      );
      card.querySelector('.osp-badge-edit').addEventListener('click', function(e){
        e.stopPropagation();
        pickImage(240, function(dataUrl){ p.photo = dataUrl; save(); render(); });
      });
      card.querySelector('.osp-card-delete').addEventListener('click', function(e){
        e.stopPropagation();
        if(confirm((p.adSoyad || 'Bu oyuncu') + ' silinsin mi?')){
          t.players = t.players.filter(function(x){ return x.id!==p.id; });
          save();
          render();
        }
      });
      card.addEventListener('click', function(){
        state.currentPlayerId = p.id; state.view='detail'; state.tab='bilgi'; render();
      });
      body.appendChild(card);
    });
  }

  var addBtn = el('<div class="osp-fab-row"><button class="osp-btn-primary"><i class="ti ti-plus" aria-hidden="true" style="margin-right:6px; vertical-align:-2px;"></i>Kadro ekle</button></div>');
  addBtn.querySelector('button').addEventListener('click', addPlayer);
  body.appendChild(addBtn);

  var delBtn = el('<button class="osp-delete-btn"><i class="ti ti-trash" aria-hidden="true" style="margin-right:5px; vertical-align:-2px;"></i>Takımı sil</button>');
  delBtn.addEventListener('click', function(){
    if(confirm('"'+t.name+'" takımını ve tüm oyuncularını silmek istediğine emin misin?')){ deleteTeam(t.id); }
  });
  body.appendChild(delBtn);
}

function renderDetailTabVeri(container, p){
  var team = getTeam();
  var keys = selectedTestKeys(team);
  ['fiz','psi','tek'].forEach(function(cat){
    var fields = RAW_FIELDS.filter(function(f){ return f.cat===cat && keys.indexOf(RAW_FIELD_TO_TEST[f.key])!==-1; });
    if(fields.length===0) return;
    var sec = el('<div class="osp-section"></div>');
    sec.appendChild(el('<p class="osp-section-title">'+CAT_LABELS[cat]+'</p>'));
    var card = el('<div class="osp-card"></div>');
    fields.forEach(function(f){
      card.appendChild(fieldRow(f.label, f.key, p[f.key], {unit:f.unit, step:f.step}));
    });
    sec.appendChild(card);
    container.appendChild(sec);
  });
}

function renderDetailTabSonuc(container, p){
  var team = getTeam();
  var ageGroup = ageOf(team);
  var tests = activeTestsFor(team);
  var d = computeDerived(p);
  var merged = Object.assign({}, p, d);
  var score = overallScore(p, team);

  var overallCard = el('<div class="osp-card osp-overall"></div>');
  overallCard.innerHTML =
    '<div class="osp-overall-num" style="color:'+scoreColor(score)+'">'+(score!==null?score:'-')+'</div>' +
    '<div class="osp-overall-scale">/ 20 GENEL NOT · '+ageGroup+' YAŞ NORMU</div>' +
    '<div class="osp-overall-verdict">'+verdictText(score)+'</div>';
  container.appendChild(overallCard);

  ['fiz','psi','tek'].forEach(function(cat){
    var catTests = tests.filter(function(t){ return t.cat===cat; });
    if(catTests.length===0) return;
    var catScores = [];
    catTests.forEach(function(t){
      var raw = t.source==='input' ? num(p[t.key]) : merged[t.source];
      var s = scoreFor(t, raw);
      if(s!==null) catScores.push(s);
    });
    var catScore = catScores.length ? round1(catScores.reduce(function(a,b){return a+b;},0)/catScores.length) : null;

    var sec = el('<div class="osp-section" style="margin-top:14px;"></div>');
    var secHead = el(
      '<div style="display:flex; align-items:baseline; justify-content:space-between; margin:0 4px 8px;">' +
        '<p class="osp-section-title" style="margin:0;">'+CAT_LABELS[cat]+'</p>' +
        '<span class="osp-num" style="font-weight:700; font-size:16px; color:'+scoreColor(catScore)+';">'+(catScore!==null?catScore:'-')+' <span style="font-size:10px; color:#a37a00; font-weight:600;">/ 20</span></span>' +
      '</div>'
    );
    sec.appendChild(secHead);
    var card = el('<div class="osp-card"></div>');
    catTests.forEach(function(t){
      var raw = t.source==='input' ? num(p[t.key]) : merged[t.source];
      var s = scoreFor(t, raw);
      var pct = s!==null ? ((s-1)/19*100) : 0;
      var row = el(
        '<div class="osp-test-row">' +
          '<div class="osp-test-info">' +
            '<p class="osp-test-name">'+t.label+'</p>' +
            '<p class="osp-test-val">'+(raw!==null?raw+' '+t.unit:'Veri yok')+'</p>' +
          '</div>' +
          '<div class="osp-bar-wrap">' +
            '<div class="osp-bar-track"><div class="osp-bar-fill" style="width:'+pct+'%; background:'+scoreColor(s)+';"></div></div>' +
            '<div class="osp-bar-score" style="color:'+scoreColor(s)+'">'+(s!==null?round1(s):'-')+'</div>' +
          '</div>' +
        '</div>'
      );
      card.appendChild(row);
    });
    sec.appendChild(card);
    container.appendChild(sec);
  });

  if(merged.hiz!==null){
    var hizCard = el(
      '<div class="osp-card" style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">' +
        '<span style="font-size:12.5px; color:#7a3b00; font-weight:600;">Hız (20m sprintten)</span>' +
        '<span class="osp-num" style="font-weight:700; font-size:16px; color:#d32f2f;">'+merged.hiz+' m/sn</span>' +
      '</div>'
    );
    container.appendChild(hizCard);
  }
}

function downloadKarne(playerName){
  var node = document.getElementById('osp-karne-capture');
  if(!node || !window.html2canvas){ alert('Karne oluşturulamadı, sayfayı yenileyip tekrar dene.'); return; }
  html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(function(canvas){
    var link = document.createElement('a');
    link.download = (playerName ? playerName.replace(/[^a-zA-Z0-9ığüşöçİĞÜŞÖÇ ]/g,'').trim().replace(/\s+/g,'-') : 'oyuncu') + '-karne.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(function(){
    alert('Karne indirilemedi, tekrar dener misin?');
  });
}

function renderDetail(){
  var p = getPlayer();
  if(!p){ state.view='squad'; render(); return; }
  var t = getTeam();

  var backBtn = document.getElementById('osp-back-btn');
  backBtn.style.display = 'flex';
  if(t && t.logo){
    backBtn.innerHTML = '<img src="'+t.logo+'" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:6px;">';
  } else {
    backBtn.innerHTML = '<i class="ti ti-arrow-left"></i>';
  }
  document.getElementById('osp-header-logo').style.display = 'none';
  document.getElementById('osp-title').textContent = p.adSoyad || ('Oyuncu #'+p.no);
  document.getElementById('osp-subtitle').textContent = 'No '+(p.no!=null?p.no:'-')+(p.yas?' · '+p.yas+' yaş':'');

  var body = document.getElementById('osp-body');
  body.innerHTML = '';

  var tabs = el(
    '<div class="osp-tabs">' +
      '<div class="osp-tab" data-tab="bilgi">Bilgi</div>' +
      '<div class="osp-tab" data-tab="veri">Test Verisi</div>' +
      '<div class="osp-tab" data-tab="sonuc">Sonuçlar</div>' +
      '<div class="osp-tab" data-tab="karne">Karne</div>' +
    '</div>'
  );
  Array.prototype.forEach.call(tabs.querySelectorAll('.osp-tab'), function(t){
    if(t.getAttribute('data-tab')===state.tab) t.classList.add('active');
    t.addEventListener('click', function(){ state.tab = t.getAttribute('data-tab'); render(); });
  });
  body.appendChild(tabs);

  var content = el('<div></div>');
  if(state.tab==='bilgi') renderDetailTabInfo(content, p);
  else if(state.tab==='veri') renderDetailTabVeri(content, p);
  else if(state.tab==='karne') renderDetailTabKarne(content, p);
  else renderDetailTabSonuc(content, p);
  body.appendChild(content);
}

function effectiveNorms(ageGroup){
  if(state.norms && state.norms[ageGroup]) return state.norms[ageGroup];
  return NORMS_BY_AGE[ageGroup] || NORMS_BY_AGE['9-10'];
}

function enterNormsEdit(){
  normsEditDraft = JSON.parse(JSON.stringify(effectiveNorms(state.guideNormAge)));
  state.normsEditMode = true;
  render();
}

function cancelNormsEdit(){
  normsEditDraft = null;
  state.normsEditMode = false;
  render();
}

function saveNormsEdit(){
  if(!state.norms) state.norms = {};
  state.norms[state.guideNormAge] = normsEditDraft;
  normsEditDraft = null;
  state.normsEditMode = false;
  save();
  render();
}

function resetNormsToDefault(){
  if(state.norms && state.norms[state.guideNormAge]){
    delete state.norms[state.guideNormAge];
    save();
  }
  render();
}

    '<div class="osp-tabs">' +
      '<div class="osp-tab" data-tab="aciklama">Açıklama</div>' +
      '<div class="osp-tab" data-tab="protokol">Test Protokolleri</div>' +
      '<div class="osp-tab" data-tab="norm">Norm Değerleri</div>' +
    '</div>'
  );
  Array.prototype.forEach.call(tabs.querySelectorAll('.osp-tab'), function(t){
    if(t.getAttribute('data-tab')===state.guideTab) t.classList.add('active');
    t.addEventListener('click', function(){ state.guideTab = t.getAttribute('data-tab'); render(); });
  });
  body.appendChild(tabs);

  var content = el('<div></div>');

  document.getElementById('osp-back-btn').style.display = 'flex';
  document.getElementById('osp-header-logo').style.display = 'none';
  document.getElementById('osp-title').textContent = 'Senkronizasyon';
  document.getElementById('osp-subtitle').textContent = 'Cihazlar arası ortak veri';
  var body = document.getElementById('osp-body');
  body.innerHTML = '';

  if(db){
    var statusCard = el('<div class="osp-card"></div>');
    var dotClass = syncStatus==='on' ? 'on' : 'off';
    var statusText = syncStatus==='on' ? 'Bağlı — değişiklikler tüm cihazlara anında yansıyor.' : 'Bağlanıyor...';
    statusCard.innerHTML =
      '<div class="osp-sync-status"><div class="osp-sync-dot '+dotClass+'"></div><span style="font-size:13px; font-weight:600; color:#1a1a1a;">'+statusText+'</span></div>' +
      '<p class="osp-guide-p" style="margin:0;">Aynı bağlantıyı başka bir cihazda (bilgisayar/telefon) kurduğunda tüm takım ve oyuncu verilerin otomatik olarak eşleşir.</p>';
    body.appendChild(statusCard);

    var discBtn = el('<button class="osp-delete-btn" style="margin-top:14px;">Bağlantıyı kaldır (bu cihazda)</button>');
    discBtn.addEventListener('click', function(){
      if(confirm('Bulut bağlantısını kaldırmak istediğine emin misin? Veriler bu cihazda yerel olarak kalmaya devam eder.')){ disconnectSync(); }
    });
    body.appendChild(discBtn);
  } else {
    var introCard = el('<div class="osp-card"></div>');
    introCard.innerHTML =
      '<p class="osp-guide-p" style="margin:0 0 8px;"><b>Cihazlar arası senkronizasyon</b></p>' +
      '<p class="osp-guide-p">Ücretsiz bir Firebase (Google) projesi oluşturup aşağıya bağlantı bilgilerini yapıştır. Kurulduktan sonra bilgisayar ve telefon aynı veriyi anlık olarak paylaşır.</p>';
    body.appendChild(introCard);

    var formCard = el('<div class="osp-card" style="margin-top:10px;"></div>');
    var label = el('<label style="display:block; font-size:12px; color:#7a3b00; margin-bottom:4px; font-weight:600;">Firebase yapılandırma kodu</label>');
    formCard.appendChild(label);
    var realTa = document.createElement('textarea');
    realTa.placeholder = '{ apiKey: "...", authDomain: "...", projectId: "...", ... }';
    formCard.appendChild(realTa);
    var connectBtn = document.createElement('button');
    connectBtn.className = 'osp-btn-primary';
    connectBtn.style.marginTop = '10px';
    connectBtn.textContent = 'Bağlan';
    connectBtn.addEventListener('click', function(){
      var cfg = parseFirebaseConfigText(realTa.value);
      if(!cfg){ alert('Yapıştırılan kod tanınamadı. Firebase konsolundaki firebaseConfig objesini olduğu gibi yapıştır.'); return; }
      connectSync(cfg);
    });
    formCard.appendChild(connectBtn);
    body.appendChild(formCard);
  }
}

function render(){
  var showSecondary = (state.view==='teams');
  document.getElementById('osp-guide-btn').style.display = showSecondary ? 'flex' : 'none';
  document.getElementById('osp-sync-btn').style.display = showSecondary ? 'flex' : 'none';
  if(state.view==='teams') renderTeams();
  else if(state.view==='newTeam') renderNewTeam();
  else if(state.view==='squad') renderSquad();
  else if(state.view==='guide') renderGuide();
  else if(state.view==='sync') renderSync();
  else renderDetail();
}

document.getElementById('osp-app-logo').src = APP_LOGO;
document.getElementById('osp-app-logo').addEventListener('click', function(){
  state.view = 'teams';
  render();
});

document.getElementById('osp-guide-btn').addEventListener('click', function(){
  state.prevView = state.view;
  state.view = 'guide';
  render();
});

document.getElementById('osp-sync-btn').addEventListener('click', function(){
  state.prevView = state.view;
  state.view = 'sync';
  render();
});

document.getElementById('osp-back-btn').addEventListener('click', function(){
  if(state.view==='detail'){ state.view = 'squad'; }
  else if(state.view==='guide' || state.view==='sync'){ state.view = state.prevView || 'teams'; }
  else { state.view = 'teams'; }
  render();
});

load();
tryAutoConnect();
render();
})();
</script>
</body>
</html>
